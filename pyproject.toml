[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logica-mind"
version = "0.2.8"
description = "Pluggable, multi-store memory for any AI system — episodic, semantic, temporal-graph and dialectic user memory in one library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rovemark" }]
keywords = ["memory", "ai", "agents", "embeddings", "rag", "knowledge-graph", "llm", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runs with ZERO third-party dependencies (stdlib only): SQLite + offline
# hashing embedder. Everything below is optional and lights up a feature.
dependencies = []

[project.optional-dependencies]
voyage = ["voyageai>=0.2"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
local = ["sentence-transformers>=2.2"]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5.0"]
all = ["voyageai>=0.2", "openai>=1.0", "anthropic>=0.39", "sentence-transformers>=2.2",
       "psycopg[binary]>=3.1", "redis>=5.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Rovemark/logica-mind"
Repository = "https://github.com/Rovemark/logica-mind"
Issues = "https://github.com/Rovemark/logica-mind/issues"
Changelog = "https://github.com/Rovemark/logica-mind/blob/main/CHANGELOG.md"

[project.scripts]
logica-mind = "logica_mind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["logica_mind"]
# ship the BUILT dashboard (logica_mind/web/dist), never the Vite dev sources or
# node_modules — keeps the wheel small and the "zero-npm for end users" promise.
exclude = ["logica_mind/web/app"]
